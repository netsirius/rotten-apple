<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Barra lateral</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wdth,wght@0,75..100,400..700;1,75..100,400..700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Secciones de Rotten Apple" style="width: 100%; height: 800px; box-sizing: border-box; padding: 18px 14px 18px; display: flex; flex-direction: column; gap: 3px; background: linear-gradient(180deg, #000240 0%, #020230 100%); border-right: 1px solid rgba(255,255,255,0.06); font-family: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; color: #FFFFFF;">
  <div style="display: flex; gap: 8px; align-items: center; padding: 0 6px 14px;" aria-hidden="true">
    <span style="display: block; width: 12px; height: 12px; border-radius: 50%; background: #FF5F57;"></span>
    <span style="display: block; width: 12px; height: 12px; border-radius: 50%; background: #FEBC2E;"></span>
    <span style="display: block; width: 12px; height: 12px; border-radius: 50%; background: #28C840;"></span>
  </div>
  <div style="display: flex; align-items: center; gap: 10px; padding: 0 6px 16px;">
    <dc-import name="Apple" estado="podrida" variante="icono" size="34" hint-size="34px,34px"></dc-import>
    <span style="font-size: 16px; font-weight: 600; letter-spacing: -0.01em;">Rotten Apple</span>
  </div>
  <sc-for list="{{top}}" as="item" hint-placeholder-count="7">
    <sc-if value="{{item.isSep}}" hint-placeholder-val="{{false}}">
      <span style="padding: 10px 12px 4px; font-size: 11.5px; letter-spacing: 0.04em; text-transform: uppercase; color: rgba(255,255,255,0.45);">{{item.label}}</span>
    </sc-if>
    <sc-if value="{{item.hasLink}}" hint-placeholder-val="{{true}}">
      <a href="{{item.href}}" aria-current="{{item.current}}" style="{{item.rowStyle}}">
        <span style="{{item.tileStyle}}" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="{{item.d}}"></path></svg></span>
        <span>{{item.label}}</span>
      </a>
    </sc-if>
    <sc-if value="{{item.noLink}}" hint-placeholder-val="{{false}}">
      <span style="{{item.rowStyle}}">
        <span style="{{item.tileStyle}}" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="{{item.d}}"></path></svg></span>
        <span>{{item.label}}</span>
      </span>
    </sc-if>
  </sc-for>
  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 3px;">
    <sc-for list="{{bottom}}" as="item" hint-placeholder-count="2">
      <a href="{{item.href}}" aria-current="{{item.current}}" style="{{item.rowStyle}}">
        <span style="{{item.tileStyle}}" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="{{item.d}}"></path></svg></span>
        <span>{{item.label}}</span>
      </a>
    </sc-for>
    <button type="button" role="switch" aria-checked="{{devChecked}}" onClick="{{toggleMode}}" style="display: flex; align-items: center; gap: 12px; min-height: 42px; margin-top: 6px; padding: 8px 12px; border: 0; border-top: 1px solid rgba(255,255,255,0.08); background: transparent; color: rgba(255,255,255,0.8); font: inherit; font-size: 14px; text-align: left; cursor: pointer;">
      <span style="flex-grow: 1;">Modo desarrollador</span>
      <span style="{{trackStyle}}" aria-hidden="true"><span style="{{knobStyle}}"></span></span>
    </button>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"current":{"editor":"enum","options":["panel","limpieza","desinstalador","espacio","privacidad","mantenimiento","monitor","dev","vul","secretos","ia","historial","ajustes"],"default":"panel"},"mode":{"editor":"enum","options":["simple","dev"],"default":"simple"},"ai":{"editor":"enum","options":["off","on"],"default":"off"},"onMode":{"editor":null},"$preview":{"width":240,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const current = this.props.current ?? 'panel';
    const mode = this.props.mode ?? 'simple';
    const isDev = mode === 'dev';
    const aiOn = (this.props.ai ?? 'off') === 'on';
    const grads = {
      panel: '#A7A2FF, #574EFF', limpieza: '#8FF5AC, #1E9E52', desinstalador: '#9CC2FF, #3A6CF0',
      espacio: '#F0CFFF, #A55BD8', privacidad: '#FFE29A, #C9861A', mantenimiento: '#9BEAF5, #1D8EA8',
      monitor: '#FFB8E0, #C2468F', dev: '#B9B4FF, #4338CA', vul: '#FFB0BC, #D23455', secretos: '#FFD0A8, #C2551E',
      ia: '#E6B7FE, #7A3FD0', historial: '#C8C8D8, #5D5D78', ajustes: '#B8B8C8, #4E4E66'
    };
    const I = {
      panel: 'M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z',
      limpieza: 'M12 3v4 M12 17v4 M3 12h4 M17 12h4 M6 6l2.5 2.5 M15.5 15.5L18 18 M6 18l2.5-2.5 M15.5 8.5L18 6',
      desinstalador: 'M4 4h7v7H4z M13 4h7v7h-7z M4 13h7v7H4z M15 16l4 4 M19 16l-4 4',
      espacio: 'M12 3a9 9 0 1 0 9 9h-9z',
      privacidad: 'M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M4 20L20 4',
      mantenimiento: 'M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z',
      monitor: 'M3 12h4l3-8 4 16 3-8h4',
      dev: 'M8 7l-5 5 5 5 M16 7l5 5-5 5',
      vul: 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z M9 12l2 2 4-4',
      secretos: 'M15 7a4 4 0 1 1-3.9 4.9L4 19v2h3v-2h2v-2h2l1.1-1.1A4 4 0 0 1 15 7z M16 10h.01',
      ia: 'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M12 10.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z',
      historial: 'M3 12a9 9 0 1 0 3-6.7 M3 4v5h5 M12 7v5l3 2',
      ajustes: 'M4 6h9 M17 6h3 M4 12h3 M11 12h9 M4 18h11 M19 18h1 M15 4v4 M9 10v4 M17 16v4'
    };
    const mk = (key, label, href) => {
      const active = key === current;
      return {
        isSep: false, label: label, d: I[key], href: href || '', hasLink: !!href, noLink: !href,
        current: active ? 'page' : 'false',
        tileStyle: 'flex-shrink: 0; display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(160deg, ' + grads[key] + '); box-shadow: inset 0 1px 0 rgba(255,255,255,0.35);',
        rowStyle: 'display: flex; align-items: center; gap: 12px; min-height: 40px; box-sizing: border-box; padding: 6px 10px; border-radius: 11px; font-size: 14.5px; text-decoration: none; ' + (active ? 'background: rgba(255,255,255,0.10); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12); color: #FFFFFF; font-weight: 600;' : 'color: rgba(255,255,255,0.85);')
      };
    };
    const sep = (label) => ({ isSep: true, hasLink: false, noLink: false, label: label });
    const top = [
      mk('panel', 'Escaneo inteligente', 'Main.dc.html'),
      mk('limpieza', 'Limpieza', 'Limpieza.dc.html'),
      mk('desinstalador', 'Aplicaciones', 'Desinstalador.dc.html'),
      mk('espacio', 'Espacio', 'Espacio.dc.html'),
      mk('privacidad', 'Privacidad', 'Privacidad.dc.html'),
      mk('mantenimiento', 'Mantenimiento', 'Mantenimiento.dc.html'),
      mk('monitor', 'Monitor', 'Monitor.dc.html')
    ];
    if (isDev) {
      top.push(sep('Desarrollo'));
      top.push(mk('dev', 'Proyectos y cachés', 'Dev.dc.html'));
      top.push(mk('vul', 'Dependencias', 'Seguridad.dc.html'));
      top.push(mk('secretos', 'Secretos', 'Secretos.dc.html'));
    }
    if (aiOn) top.push(mk('ia', 'Organizar con IA', 'IA.dc.html'));
    const bottom = [ mk('historial', 'Historial', 'Historial.dc.html'), mk('ajustes', 'Ajustes', 'Ajustes.dc.html') ];
    const onMode = this.props.onMode;
    return {
      top: top,
      bottom: bottom,
      devChecked: isDev ? 'true' : 'false',
      trackStyle: 'position: relative; flex-shrink: 0; width: 36px; height: 20px; border-radius: 999px; ' + (isDev ? 'background: #574EFF;' : 'background: rgba(255,255,255,0.18);'),
      knobStyle: 'position: absolute; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #FFFFFF; ' + (isDev ? 'left: 18px;' : 'left: 2px;'),
      toggleMode: () => { if (typeof onMode === 'function') onMode(isDev ? 'simple' : 'dev'); }
    };
  }
}
</script>
</body>
</html>
