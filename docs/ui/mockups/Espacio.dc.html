<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Espacio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wdth,wght@0,75..100,400..700;1,75..100,400..700&amp;display=swap">
<style>
@font-face{font-family:"Commit Mono";src:url("/_blob/39ac0b959ac963a46465b07e82f09eff") format("woff2");font-weight:200 700;font-style:normal;font-display:swap}
body{margin:0;background:#05051A}
a{color:#C9C6FF}a:hover{color:#FFFFFF}
:focus-visible{outline:2px solid #E6B7FE;outline-offset:3px}
</style>
</helmet>
<div style="width: 1360px; height: 904px; position: relative; overflow: hidden; background: radial-gradient(900px 600px at 18% 12%, rgba(87,78,255,0.30), rgba(87,78,255,0) 70%), radial-gradient(800px 600px at 88% 92%, rgba(230,183,254,0.16), rgba(230,183,254,0) 70%), #05051A; font-family: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; color: #FFFFFF;">
  <div aria-hidden="true" style="height: 26px; display: flex; align-items: center; gap: 20px; padding: 0 18px; background: rgba(0,0,0,0.5); font-size: 13px; color: rgba(255,255,255,0.9);">
    <span style="font-weight: 700;">Rotten Apple</span><span>Archivo</span><span>Edición</span><span>Ver</span><span>Ventana</span><span>Ayuda</span>
    <span style="margin-left: auto; color: rgba(255,255,255,0.8);">dom 1 nov · 10:38</span>
  </div>
  <div style="position: absolute; left: 40px; top: 66px; width: 1280px; height: 800px; display: flex; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.16); box-shadow: 0 50px 120px -20px rgba(0,0,0,0.8); background: radial-gradient(60% 75% at 72% 30%, rgba(87,78,255,0.42) 0%, rgba(87,78,255,0) 70%), radial-gradient(45% 55% at 88% 100%, rgba(230,183,254,0.22) 0%, rgba(230,183,254,0) 70%), linear-gradient(155deg, #000240 0%, #03032A 50%, #0D0848 100%);">
    <div style="flex: 0 0 240px; display: flex;">
      <dc-import name="Sidebar" current="espacio" mode="simple" hint-size="100%,800px"></dc-import>
    </div>
    <main style="flex: 1 1 auto; min-width: 0; height: 800px; position: relative; overflow: hidden;">
      <header style="display: flex; align-items: flex-end; gap: 16px; padding: 44px 48px 18px;">
        <div style="flex-grow: 1;">
          <h1 style="margin: 0; font-size: 40px; font-weight: 400; letter-spacing: -0.025em;">Espacio</h1>
          <p style="margin: 8px 0 0; font-size: 16px; color: rgba(255,255,255,0.72);">Qué ocupa tu carpeta personal: <span style="font-family: 'Commit Mono', ui-monospace, Menlo, monospace; color: #FFFFFF;">306 GB</span> · tamaño real en disco</p>
        </div>
        <span style="padding-bottom: 4px; font-size: 13px; color: rgba(255,255,255,0.6);">12 GB solo en iCloud, sin descargar</span>
      </header>
      <div style="display: flex; gap: 28px; padding: 0 48px; height: 440px;">
        <section aria-label="Mapa de tu carpeta" style="flex: 1 1 auto; min-width: 0; display: flex; gap: 6px;">
          <div style="flex: 158 1 0; min-width: 0; display: flex; flex-direction: column; gap: 6px;">
            <button type="button" onClick="{{pickLib}}" style="{{blk.lib}}"><span style="font-size: 15px; font-weight: 600;">Biblioteca</span><span style="font-family: 'Commit Mono', ui-monospace, Menlo, monospace; font-size: 13px;">84 GB</span></button>
            <button type="button" onClick="{{pickPic}}" style="{{blk.pic}}"><span style="font-size: 15px; font-weight: 600;">Imágenes</span><span style="font-family: 'Commit Mono', ui-monospace, Menlo, monospace; font-size: 13px;">74 GB</span></button>
          </div>
          <div style="flex: 148 1 0; min-width: 0; display: flex; flex-direction: column; gap: 6px;">
            <div style="flex: 89 1 0; display: flex; gap: 6px;">
              <button type="button" onClick="{{pickCode}}" style="{{blk.code}}"><span style="font-size: 15px; font-weight: 600;">code</span><span style="font-family: 'Commit Mono', ui-monospace, Menlo, monospace; font-size: 13px;">58 GB</span></button>
              <button type="button" onClick="{{pickMov}}" style="{{blk.mov}}"><span style="font-size: 15px; font-weight: 600;">Películas</span><span style="font-family: 'Commit Mono', ui-monospace, Menlo, monospace; font-size: 13px;">31 GB</span></button>
            </div>
            <div style="flex: 59 1 0; display: flex; gap: 6px;">
              <button type="button" onClick="{{pickDl}}" style="{{blk.dl}}"><span style="font-size: 14px; font-weight: 600;">Descargas</span><span style="font-family: 'Commit Mono', ui-monospace, Menlo, monospace; font-size: 12px;">22 GB</span></button>
              <button type="button" onClick="{{pickDoc}}" style="{{blk.doc}}"><span style="font-size: 14px; font-weight: 600;">Documentos</span><span style="font-family: 'Commit Mono', ui-monospace, Menlo, monospace; font-size: 12px;">18 GB</span></button>
              <div style="flex: 19 1 0; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px 10px; border-radius: 12px; background: rgba(255,255,255,0.10); font-size: 11.5px; line-height: 1.25;"><span style="font-weight: 600;">Otros</span><span style="font-family: 'Commit Mono', ui-monospace, Menlo, monospace;">19 GB</span></div>
            </div>
          </div>
        </section>
        <aside style="flex: 0 0 330px; overflow: auto; display: flex; flex-direction: column; gap: 14px; padding: 22px; border-radius: 18px; background: rgba(255,255,255,0.06); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);">
          <div>
            <h2 style="margin: 0; font-size: 17px; font-weight: 600;">{{sel.name}} <span style="font-family: 'Commit Mono', ui-monospace, Menlo, monospace; font-size: 14px; font-weight: 400; color: rgba(255,255,255,0.75);">{{sel.size}}</span></h2>
            <p style="margin: 6px 0 0; font-size: 13.5px; line-height: 1.5; color: rgba(255,255,255,0.75);">{{sel.note}}</p>
          </div>
          <div style="display: flex; flex-direction: column;">
            <span style="padding-bottom: 6px; font-size: 13px; color: rgba(255,255,255,0.55);">Grandes y sin abrir en un año · nada viene marcado</span>
            <sc-for list="{{files}}" as="f" hint-placeholder-count="5">
              <label style="display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.07); cursor: pointer;">
                <input type="checkbox" checked="{{f.on}}" onChange="{{f.toggle}}" style="width: 16px; height: 16px; margin: 0; accent-color: #574EFF;">
                <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px;">
                  <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px;">{{f.name}}</span>
                  <span style="font-size: 11.5px; color: rgba(255,255,255,0.55);">{{f.where}} · {{f.age}}</span>
                </span>
                <span style="white-space: nowrap; font-family: 'Commit Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: rgba(255,255,255,0.8);">{{f.size}}</span>
              </label>
            </sc-for>
          </div>
        </aside>
      </div>
      <sc-if value="{{hasSel}}" hint-placeholder-val="{{false}}">
        <a href="Revision.dc.html" style="position: absolute; left: 50%; bottom: 52px; transform: translateX(-50%); display: flex; align-items: center; justify-content: center; width: 116px; height: 116px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.35); background: radial-gradient(circle at 35% 30%, #9C96FF 0%, #574EFF 55%, #3A2FD8 100%); box-shadow: 0 0 0 10px rgba(87,78,255,0.16), 0 24px 60px -12px rgba(87,78,255,0.95); color: #FFFFFF; font-size: 19px; font-weight: 600; text-decoration: none;">Revisar</a>
      </sc-if>
      <p style="position: absolute; left: 0; right: 0; bottom: 18px; margin: 0; text-align: center; font-size: 12.5px; color: rgba(255,255,255,0.6);">{{caption}}</p>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":904}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const pick = st.pick || 'dl';
    const checks = st.checks || {};
    const base = 'min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start; gap: 3px; padding: 12px 14px; border-radius: 14px; color: #FFFFFF; font: inherit; text-align: left; cursor: pointer; ';
    const bg = { lib: 'rgba(87,78,255,0.55)', pic: 'rgba(230,183,254,0.38)', code: 'rgba(95,237,131,0.28)', mov: 'rgba(167,162,255,0.34)', dl: 'rgba(255,194,122,0.34)', doc: 'rgba(156,194,255,0.30)' };
    const grow = { lib: 84, pic: 74, code: 58, mov: 31, dl: 22, doc: 18 };
    const blk = {};
    Object.keys(bg).forEach((k) => {
      blk[k] = base + 'flex: ' + grow[k] + ' 1 0; background: ' + bg[k] + '; ' + (k === pick ? 'border: 2px solid rgba(255,255,255,0.9);' : 'border: 2px solid transparent;');
    });
    const info = {
      lib: { name: 'Biblioteca', size: '84 GB', note: 'Datos de apps, cachés y copias de iPhone. Lo que se puede limpiar con seguridad está en Limpieza; aquí solo se explora.' },
      pic: { name: 'Imágenes', size: '74 GB', note: 'La fototeca de Fotos ocupa 71 GB. No se toca desde aquí: gestiónala desde Fotos.' },
      code: { name: 'code', size: '58 GB', note: '42 proyectos. 15,7 GB son artefactos que se regeneran: míralo en Desarrollo.' },
      mov: { name: 'Películas', size: '31 GB', note: 'Un proyecto de Final Cut de 2023 ocupa 9,8 GB y no se abre desde hace dos años.' },
      dl: { name: 'Descargas', size: '22 GB', note: '7 instaladores (3,1 GB) y 412 archivos de más de 6 meses.' },
      doc: { name: 'Documentos', size: '18 GB', note: 'Sincronizado con iCloud: 12 GB solo están en la nube y no cuentan como espacio local.' }
    };
    const list = [
      { id: 'f1', name: 'Boda 2023.fcpbundle', where: '~/Movies', age: 'hace 2 años', size: '9,8 GB', gb: 9.8 },
      { id: 'f2', name: 'Grabación de pantalla 2024-05-12.mov', where: '~/Desktop', age: 'hace 17 meses', size: '4,1 GB', gb: 4.1 },
      { id: 'f3', name: 'Islandia RAW.zip', where: '~/Downloads', age: 'hace 14 meses', size: '3,6 GB', gb: 3.6 },
      { id: 'f4', name: 'dataset-entrenamiento.csv', where: '~/Documents', age: 'hace 18 meses', size: '1,9 GB', gb: 1.9 },
      { id: 'f5', name: 'Episodio 12 sin editar.wav', where: '~/Music', age: 'hace 2 años', size: '1,1 GB', gb: 1.1 }
    ];
    const total = list.reduce((a, f) => a + (checks[f.id] ? f.gb : 0), 0);
    const files = list.map((f) => ({
      name: f.name, where: f.where, age: f.age, size: f.size, on: !!checks[f.id],
      toggle: () => { const n = Object.assign({}, checks); n[f.id] = !checks[f.id]; this.setState({ checks: n }); }
    }));
    const p = (k) => () => this.setState({ pick: k });
    return {
      blk: blk, sel: info[pick], files: files,
      hasSel: total > 0,
      caption: total > 0 ? total.toFixed(1).replace('.', ',') + ' GB seleccionados · verás la lista antes de moverlos a la Papelera' : 'Son tus archivos: nada viene marcado. Marca lo que quieras revisar.',
      pickLib: p('lib'), pickPic: p('pic'), pickCode: p('code'), pickMov: p('mov'), pickDl: p('dl'), pickDoc: p('doc')
    };
  }
}
</script>
</body>
</html>
