<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":904}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const checks = st.checks || {};
    const G = { dmg: '#9CC2FF, #3A6CF0', pkg: '#FFD08A, #C27612', zip: '#C8C8D8, #5D5D78', iso: '#F0CFFF, #A55BD8', xip: '#B9B4FF, #4338CA' };
    const list = [
      { id: 'a', name: 'VSCode-darwin-arm64.zip', ext: 'zip', source: 'Descargas', age: 'hace 5 meses', size: '182 MB', gb: 0.18, installed: true },
      { id: 'b', name: 'Docker.dmg', ext: 'dmg', source: 'Descargas', age: 'hace 8 meses', size: '612 MB', gb: 0.61, installed: true },
      { id: 'c', name: 'setup-node-v20.pkg', ext: 'pkg', source: 'Escritorio', age: 'hace 1 año', size: '74 MB', gb: 0.07, installed: true },
      { id: 'd', name: 'Xcode_16.2.xip', ext: 'xip', source: 'Descargas', age: 'hace 10 meses', size: '3,0 GB', gb: 3.0, installed: false },
      { id: 'e', name: 'ubuntu-24.04-desktop-arm64.iso', ext: 'iso', source: 'Descargas', age: 'hace 1 año', size: '2,9 GB', gb: 2.9, installed: false },
      { id: 'f', name: 'Zoom.pkg', ext: 'pkg', source: 'Adjunto de Mail', age: 'hace 2 años', size: '98 MB', gb: 0.1, installed: false },
      { id: 'g', name: 'Figma.dmg', ext: 'dmg', source: 'Telegram', age: 'hace 6 meses', size: '210 MB', gb: 0.21, installed: true }
    ];
    let total = 0;
    const rows = list.map((r) => {
      const on = !!checks[r.id];
      if (on) total += r.gb;
      return {
        name: r.name, ext: r.ext.toUpperCase(), source: r.source, age: r.age, size: r.size, installed: r.installed, on: on,
        tile: 'flex-shrink: 0; display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 10px; background: linear-gradient(160deg, ' + G[r.ext] + '); box-shadow: inset 0 1px 0 rgba(255,255,255,0.35); font-family: \'Commit Mono\', ui-monospace, Menlo, monospace; font-size: 10px; font-weight: 600;',
        toggle: () => { const n = Object.assign({}, checks); n[r.id] = !on; this.setState({ checks: n }); }
      };
    });
    return { rows: rows, total: total.toFixed(1).replace('.', ',') + ' GB' };
  }
}
</script>
