# Paridad de comandos (T-02 · RF-CLI-20, RF-CLI-21).
#
# Un `[[command]]` por cada comando de 07 §2 (paridad con Mole) y §3
# (nuevos), con las fases de 07 corregidas por las decisiones del autor del
# 2026-11-08 (08 §2.1, «Paridad total en el MVP»): todos los comandos de Mole
# son MVP; `slim` es MVP condicionado; `trash`, `trash put` y
# `optimize startup` están aprobados como MVP.
#
# Lo que no es un comando (teclas, variables de entorno, ficheros de
# configuración, instalación) sigue en 08 §1.5.
#
# Campos:
#   id      nombre único de la fila.
#   cli     cómo se escribe; las palabras antes del primer argumento o flag
#           son el subcomando.
#   mole    equivalente en Mole ("" si el comando es nuevo).
#   source  fila de 07 de la que sale.
#   phase   "mvp" | "v1" | "v2".
#   status  "done" | "pending".
#   task    tarea de 08 que lo implementa ("" si ya estaba hecho).
#   run     (obligatorio si status = "done") argumentos con los que la prueba
#           lo ejecuta sobre la carpeta personal de prueba: `--dry-run --json`
#           si cambia algo, `--json` si es de lectura. `$HOME` se sustituye
#           por la carpeta personal de prueba (las rutas no expanden `~`) y
#           `$OP` por la operación (`report.op_id`) de la última preparación.
#   setup   (opcional) comandos previos, p. ej. una limpieza antes de `undo`.
#   exit    (opcional, 0 por defecto) código de salida esperado.
#   json    (opcional, true por defecto) false si la salida no es JSON.
#   note    (opcional) aclaración.
#
# Al implementar un comando: cambia `status` a "done", añade `run` y su
# esquema en `schemas/`. La prueba falla si un comando "pending" ya existe.

# ── 07 §2 · Paridad con Mole ────────────────────────────────────────────

