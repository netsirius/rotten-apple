[package]
name = "rotten"
description = "CLI de Rotten Apple."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rotten"
path = "src/main.rs"

[dependencies]
clap.workspace = true
fluent-bundle.workspace = true
jiff.workspace = true
unic-langid.workspace = true
ra-core.workspace = true
serde_json.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
ra-catalog = { workspace = true, features = ["fixtures"] }
tempfile.workspace = true
# Esquemas JSON y snapshots de la salida (T-01). Solo pruebas; sin las
# features por defecto de `jsonschema`, que traen HTTP y TLS.
insta = { version = "1.43", default-features = false, features = ["json"] }
jsonschema = { version = "0.60", default-features = false }
# Lectura de `tests/parity.toml` (T-02).
serde.workspace = true
toml.workspace = true

[lints]
workspace = true
