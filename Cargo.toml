[workspace]
resolver = "3"
members = [
    "crates/ra-platform",
    "crates/ra-safety",
    "crates/ra-catalog",
    "crates/ra-plan",
    "crates/ra-history",
    "crates/ra-exec",
    "crates/ra-core",
    "crates/rotten",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/netsirius/rotten-apple"
publish = false

[workspace.dependencies]
ra-platform = { path = "crates/ra-platform" }
ra-safety = { path = "crates/ra-safety" }
ra-catalog = { path = "crates/ra-catalog" }
ra-plan = { path = "crates/ra-plan" }
ra-history = { path = "crates/ra-history" }
ra-exec = { path = "crates/ra-exec" }
ra-core = { path = "crates/ra-core" }

blake3 = "1.8"
# `string`: textos de la ayuda generados en tiempo de ejecución (T-03).
clap = { version = "4.5", features = ["derive", "string"] }
# Scripts de autocompletado de `rotten completion` (T-14; MIT o Apache-2.0).
clap_complete = "4.6"
# Mensajes del CLI con plurales (T-03, Project Fluent; MIT o Apache-2.0).
fluent-bundle = "0.16"
globset = "0.4"
humantime = "2.2"
# Fechas del historial en la zona horaria local (T-03; Unlicense o MIT).
jiff = "0.2"
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }
plist = "1.7"
rustix = { version = "1.0", features = ["fs", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.9"
unic-langid = "0.9"
unicode-normalization = "0.1"

# Solo pruebas
assert_cmd = "2.0"
proptest = "1.7"
tempfile = "3.20"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
