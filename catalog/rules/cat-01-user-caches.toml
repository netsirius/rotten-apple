# CAT-01 · Archivos temporales de apps (02 §5; README §4; 06 I-15).
#
# Todo `~/Library/Caches/*` es «Seguro», pero solo se preseleccionan los
# bundle IDs de `preselect_names`, una lista permitida que exige validación
# en VM (V-18: borrar cada candidata y observar efectos). Mientras V-18 no
# esté hecha la lista está VACÍA: el resto aparece sin marcar y con una
# antigüedad mínima de 7 días.

[[rule]]
id = "user-caches"
version = 1
cat = "CAT-01"
risk = "safe"
regenerable = true
preselect = false
# Añadir aquí solo bundle IDs validados (V-18), cada uno con su evidencia.
preselect_names = []
action = "trash"
roots = ["~/Library/Caches"]
include = ["*"]
exclude = [
    # Cachés con estado (02 §5 CAT-01; lista versionada pendiente de V-18).
    "com.apple.bird",
    "CloudKit",
    "com.apple.akd",
    "com.apple.nsurlsessiond",
    "FamilyCircle",
    "com.apple.HomeKit",
    # Miniaturas de Quick Look: RF-MAN-05.
    "com.apple.QuickLook.thumbnailcache",
    # Navegadores: van por CAT-08, que exige el navegador cerrado.
    "com.apple.Safari",
    "Google",
    "Firefox",
    "Microsoft Edge",
    "BraveSoftware",
    "Arc",
    # Zona Desarrollador (doc 03; D-03: cachés globales solo en lectura).
    "Homebrew",
    "pip",
    "pypoetry",
    "Yarn",
    "pnpm",
    "node-gyp",
    "go-build",
    "CocoaPods",
    "org.swift.swiftpm",
    "JetBrains",
]
max_depth = 1
min_age_days = 7
# La carpeta suele llamarse como el bundle ID de su app: si está abierta, se omite.
app_not_running = ["{bundle_id}"]
title = { es = "Caché de app", en = "App cache" }
explain = { es = "Archivos que una app guarda para ir más rápido (miniaturas, descargas a medias, datos precalculados).", en = "Files an app keeps to work faster (thumbnails, partial downloads, precomputed data)." }
if_deleted = { es = "La app puede ir más lenta la primera vez mientras los vuelve a crear; no pierdes documentos ni ajustes.", en = "The app may be slower the first time while it rebuilds them; you keep your documents and settings." }
regenerates = { es = "Sí: la app los vuelve a crear cuando los necesita.", en = "Yes: the app rebuilds them when it needs them." }
why_risk = { es = "Seguro: es caché por definición y se omite si la app está abierta. Solo se preseleccionan las apps validadas; el resto aparece sin marcar y con más de 7 días.", en = "Safe: it is cache by definition and it is skipped while the app is open. Only validated apps are preselected; the rest is shown unselected and older than 7 days." }
evidence = "02 §5 CAT-01; 06 I-15"
