# CAT-08 · Cachés de navegadores (02 §5). MVP: Safari, Chrome y Firefox.
#
# «Seguro» solo con el navegador cerrado: si está abierto, o no se puede
# saber, el elemento se omite. Nunca cookies, historial, contraseñas,
# marcadores, almacenamiento local ni sesiones (`never`). La caché de Safari
# dentro de su contenedor queda fuera hasta cerrar V-03.

[[rule]]
id = "browsers.safari.cache"
version = 1
cat = "CAT-08"
risk = "safe"
regenerable = true
preselect = true
action = "trash"
requires = ["fda"]
roots = ["~/Library/Caches"]
include = ["com.apple.Safari"]
max_depth = 1
app_not_running = ["com.apple.Safari"]
never = ["Cookies", "History", "Login Data", "Bookmarks", "Local Storage", "IndexedDB", "Sessions", "Service Worker"]
title = { es = "Caché de Safari", en = "Safari cache" }
explain = { es = "Copias de páginas, imágenes y scripts de las webs que visitas, para que carguen antes.", en = "Copies of pages, images and scripts from the sites you visit, so they load faster." }
if_deleted = { es = "Las webs tardan algo más en cargar la primera vez; no pierdes historial, contraseñas, marcadores ni sesiones.", en = "Sites take a little longer to load the first time; you keep your history, passwords, bookmarks and sessions." }
regenerates = { es = "Sí: Safari las vuelve a descargar al visitar cada web.", en = "Yes: Safari downloads them again when you visit each site." }
why_risk = { es = "Seguro: es caché y solo se toca con Safari cerrado.", en = "Safe: it is cache and it is only touched while Safari is closed." }
evidence = "02 §5 CAT-08"

