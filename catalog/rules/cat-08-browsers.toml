[[rule]]
id = "browsers.chrome.profile-caches"
version = 1
cat = "CAT-08"
risk = "safe"
regenerable = true
preselect = true
action = "trash"
roots = ["~/Library/Application Support/Google/Chrome"]
include = ["*/Code Cache", "*/GPUCache"]
max_depth = 2
app_not_running = ["com.google.Chrome"]
never = ["Cookies", "History", "Login Data", "Bookmarks", "Local Storage", "IndexedDB", "Sessions", "Service Worker"]
title = { es = "Caché de código de Chrome", en = "Chrome code cache" }
explain = { es = "Código JavaScript y sombreadores gráficos que Chrome compila dentro de tu perfil.", en = "JavaScript code and graphics shaders Chrome compiles inside your profile." }
if_deleted = { es = "Chrome y algunas webs pueden ir más lentos un rato; tu perfil, historial y contraseñas no se tocan.", en = "Chrome and some sites may be slower for a while; your profile, history and passwords are not touched." }
regenerates = { es = "Sí: Chrome los vuelve a compilar cuando hacen falta.", en = "Yes: Chrome compiles them again when needed." }
why_risk = { es = "Seguro: solo se eligen las carpetas de caché del perfil, nunca sus datos, y con Chrome cerrado.", en = "Safe: only the profile's cache folders are chosen, never its data, and only while Chrome is closed." }
evidence = "02 §5 CAT-08"

